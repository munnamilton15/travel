<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login · TravelBharat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" id="loginForm">
      <div class="auth-icon">🛡️</div>
      <h1 class="display" style="font-size:1.8rem">Admin Login</h1>
      <p style="color:var(--muted-ink);font-size:.85rem;margin-bottom:20px">Default · admin / password123</p>
      <div class="field" style="text-align:left"><label>Username</label><input class="input" id="username" required value="admin"/></div>
      <div class="field" style="text-align:left"><label>Password</label><input class="input" id="password" type="password" required /></div>
      <button class="btn btn-primary" type="submit" style="width:100%;margin-top:8px">Login</button>
      <a href="/" style="display:block;margin-top:14px;color:var(--muted-ink);font-size:.85rem">← Back to site</a>
    </form>
  </div>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const { token } = await tb.api('/api/auth/login', { method: 'POST', body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }) });
        localStorage.setItem('tb_token', token);
        location.href = '/admin-dashboard.html';
      } catch (err) { tb.toast(err.message, 'error'); }
    });
  </script>
</body>
</html>
